# 짜임 카드 설명 — scripts/build_cards.py 가 이 파일과 slides.html 로 LAYOUTS.md 를 만든다.
# 장 마크업(복사용 HTML)은 slides.html 이 원본이다. 여기에는 판단에 필요한 말만 적는다.
# 항목: id(slides.html 의 장) · name · when(내용 모양) · structure(구조) · hero(주인공) · do · dont · swap(다른 내용에 쓸 때 바꿀 곳)

- id: l-amount
  name: 큰 금액 하나
  when: 한 숫자가 뉴스 전부 — 거래액 · 투자액 · 예산 · 손실액
  structure: 큰 숫자(8rem) + 기준 한 줄 → 굵은 분할 막대(구성 비율) → 아래 수치 칸 3개
  hero: 큰 숫자
  do: [숫자 옆에 무엇의 합계인지(포함 · 제외) 한 줄, 분할 막대 폭은 실제 비율]
  dont: [숫자를 카드 안에 작게 가두기, 수치 칸을 4개 이상으로 늘리기]
  swap: 분할 막대의 칸 수와 비율(--w) · 수치 칸 3개의 라벨

- id: l-trend
  name: 추세 + 구성
  when: 시간에 따른 변화와 지금 시점의 구성비를 함께 — 분기 매출 · 비중
  structure: 왼쪽 세로 막대(시점 3~5개, 지금만 진하게) + 증가율 · 오른쪽 도넛(donut.py) + 범례
  hero: 지금 시점 막대와 도넛 가운데 비율
  do: [지금 시점만 주인공 색 · 나머지 회색, 도넛은 scripts/donut.py --live 로 생성]
  dont: [시점마다 다른 색, 도넛 각도 손으로 쓰기, 파이 차트]
  swap: 막대 높이(--h, 최댓값 100%) · donut.py 값

- id: l-rule
  name: 규칙 전후
  when: 규칙 · 제도 · 절차가 바뀜 — 무엇이 더해졌나
  structure: 두 줄 흐름 — 위 「기존」(흐리게) · 아래 「추가」(옅은 바탕), 심사 · 관문 칸만 짙게 · 맨 아래 「읽는 법」 한 줄
  hero: 아래 줄의 짙은 칸(바뀐 지점)
  do: [두 줄의 칸 순서를 맞춰 무엇이 달라졌는지 위아래로 비교, 확대 해석 경계는 노트에]
  dont: [두 줄을 좌우로 나란히(비교가 안 됨), 짙은 칸을 둘 이상]
  swap: 각 줄의 칸 3개(아이콘 · 이름 · 설명) · 짙은 칸 위치

- id: l-structure
  name: 구조 · 층
  when: 부품 · 조직 · 시스템의 층과 그중 바뀐 곳
  structure: 왼쪽 단면 그림(층을 위에서 아래로) + 오른쪽 주석 카드 2개(바뀐 층) + 아래 일정 띠
  hero: 단면 그림에서 짙게 칠한 층
  do: [주석 카드 테두리 색을 그림의 층 색과 맞춤, 일정 띠는 확정 · 검토 · 목표를 구분]
  dont: [층을 표로 나열, 주석을 셋 이상]
  swap: 층 이름 · 짙게 칠할 층 · 주석 카드 2개

- id: l-path
  name: 경로 · 흐름
  when: 무언가가 거쳐 가는 길 — 전력 · 데이터 · 결재 · 물류
  structure: 전체 폭 아이콘 경로(5마디) + 핵심 마디에서 아래로 점선을 내린 설명 카드
  hero: 짙은 원 마디(관여 지점)
  do: [마디는 4~6개, 설명 카드는 해당 마디 바로 아래]
  dont: [모든 마디에 설명, 화살표 대신 표]
  swap: 마디 아이콘(bl-i--*) · 이름 · 설명 카드의 grid-column 위치

- id: l-versus
  name: 1:1 비교
  when: 두 선택지를 같은 기준으로 — 요금제 · 모델 · 안 A/B
  structure: 가격표 카드 둘(같은 행 순서) + 가운데 배수 · 차이 + 아래 비교 기준 한 줄
  hero: 오른쪽(또는 권장) 카드 숫자
  do: [두 카드의 행 순서 · 단위 동일, 비교 기준(무엇으로 고르나)을 반드시 함께]
  dont: [항목 수가 다른 두 카드, 셋 이상 비교(→ 표나 막대)]
  swap: 카드 머리 · 행 라벨 · 가격 · 가운데 배수

- id: l-taxonomy
  name: 분류 · 구성
  when: 묶음별 개수가 의미 — 제품군 · 모델 종류 · 조직 단위
  structure: 개수에 비례한 크기의 타일(트리맵) — 많은 묶음은 크게 · 짙게, 적은 묶음은 작게
  hero: 가장 큰 타일
  do: [타일 크기 = 개수, 타일 안에 실제 항목 이름]
  dont: [모든 타일 같은 크기(→ 그냥 목록이 됨), 색으로만 묶음 구분]
  swap: grid-template-areas(타일 배치) · 타일 내용

- id: l-plan
  name: 계획 · 목표
  when: 지금 한 일과 몇 년 목표 — 협약 · 투자 계획 · 로드맵
  structure: 위 큰 숫자 3칸(목표) + 아래 연표(지금 칸은 짙게, 기간 띠는 연도 칸에 맞춤)
  hero: 위 큰 숫자 중 핵심 하나(코발트)
  do: [지금 한 일과 목표를 구분해 표시, 기간 띠를 실제 연도 칸에 맞춤]
  dont: [목표 숫자를 이미 이룬 것처럼, 연표 칸과 띠 어긋남]
  swap: 큰 숫자 3칸 · 연도 칸 수 · 띠 grid-column

- id: l-screen
  name: 화면 · 사용법
  when: 기능 · 화면이 바뀜 — 앱 업데이트 · 새 도구
  structure: 왼쪽 큰 목업(실제 쓰임 예) + 오른쪽 사용 순서 3단계(마지막 단계만 짙게)
  hero: 목업 속 바뀐 부분(번역문 · 새 버튼)
  do: [목업이 재구성이면 「실제 화면 아님」 표기, 목업 속 대화는 자연스러운 말투]
  dont: [실제 캡처인 척, 목업 속 글까지 개조식으로]
  swap: 목업 내용 · 단계 3개

- id: l-stages
  name: 단계별 수치
  when: 업무 · 공정 단계마다 값이 다름 — 활용률 · 소요 시간 · 불량률
  structure: 흐름 순서 세로 막대 + 위에 묶음(앞단 · 뒷단) 평균 띠 + 평균 점선
  hero: 가장 높은 묶음과 가장 낮은 묶음의 대비(코발트 vs 주황)
  do: [막대 순서 = 실제 흐름 순서(크기순 아님), 묶음 평균을 위 띠로]
  dont: [크기순 정렬로 흐름을 지움, 묶음마다 다른 색 셋 이상]
  swap: 막대 높이(--h) · 묶음 띠의 grid-column · 평균선 위치

- id: l-map
  name: 요약 지도
  when: 덱 첫머리 — 여러 건을 한 장에 배치(목차 대신)
  structure: 가치사슬 · 흐름 칸(6칸) 머리 + 칸마다 해당 항목 카드(번호 · 이름 · 핵심 수치)
  hero: 제목의 결론 한 줄
  do: [칸 순서가 의미(흐름 · 단계), 카드마다 핵심 수치 하나]
  dont: [칸 없이 목록, 카드에 설명 문장]
  swap: 칸 이름 · 카드 배치(grid-column)

- id: l-watch
  name: 점검 카드
  when: 덱 끝 — 다음에 확인할 것 2~4개
  structure: 같은 크기 카드 3장(번호 · 지표 · 왜 · 확인할 곳 · 이어 볼 항목), 가장 중요한 하나만 짙게
  hero: 짙은 카드
  do: [확인할 곳(출처 · 방법)을 반드시, 앞 장 번호로 연결]
  dont: [카드마다 다른 형식, 다짐 · 구호]
  swap: 카드 내용 · 짙은 카드 위치
