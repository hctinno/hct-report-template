# 격리 구성.
#
# 핵심은 `internal: true` 다. 이 네트워크에는 기본 게이트웨이가 붙지 않아
# 컨테이너에서 외부로 나가는 IP 경로 자체가 없다. 방화벽 규칙에 기대지
# 않고 네트워크 계층에서 끊는다.
#
# 내부 네트워크에는 포트를 퍼블리시할 수 없다. 의도한 제약이며, 사용자는
# `docker compose run --rm app ...` 으로 같은 네트워크 안에서 CLI 를 쓴다.

name: onprem-ai

networks:
  ai_internal:
    driver: bridge
    internal: true          # 외부 경로 없음. 이 줄을 지우면 격리가 깨진다.

volumes:
  models:                   # 반입된 가중치. 읽기 전용으로 마운트한다.
  index:                    # 색인 산출물
  audit:                    # 감사 로그

services:
  runtime:
    image: ollama/ollama:latest
    container_name: onprem-runtime
    networks: [ai_internal]
    volumes:
      - models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: 1
      # 레지스트리 접근 시도를 막는다. 가중치는 반입 절차로만 들어온다.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: onprem-ai-app:local
    container_name: onprem-app
    networks: [ai_internal]
    depends_on:
      runtime:
        condition: service_healthy
    environment:
      ONPREM_BACKEND: ollama
      ONPREM_BASE_URL: http://runtime:11434
      ONPREM_CHAT_MODEL: ${ONPREM_CHAT_MODEL:-gemma3:12b}
      ONPREM_EMBED_MODEL: ${ONPREM_EMBED_MODEL:-bge-m3}
      ONPREM_INDEX_DIR: /var/onprem/index
      ONPREM_AUDIT_LOG: /var/onprem/audit/audit.jsonl
      ONPREM_CORPUS_DIR: /var/onprem/corpus
    volumes:
      - ../data/corpus:/var/onprem/corpus:ro
      - index:/var/onprem/index
      - audit:/var/onprem/audit
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # 기본은 진단. 실제 사용은 `docker compose run --rm app ask "질문"`.
    command: ["doctor"]
